              <text x="40" y="16" fill="#f1f5f9" font-family="sans-serif" font-size="10">Ali Turan</text>
              <text x="170" y="16" fill="#94a3b8" font-family="monospace" font-size="10">20240911</text>
              <text x="270" y="16" fill="#10b981" font-family="monospace" font-size="10">Admin (Full)</text>
