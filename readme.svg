            <text x="10" y="18" fill="#022c22" font-family="monospace" font-size="10" font-weight="800">#</text>
            <text x="40" y="18" fill="#022c22" font-family="monospace" font-size="10" font-weight="800">STUDENT NAME</text>
            <text x="170" y="18" fill="#022c22" font-family="monospace" font-size="10" font-weight="800">SCHOOL NO</text>
            <text x="270" y="18" fill="#022c22" font-family="monospace" font-size="10" font-weight="800">ROLE / ACCESS</text>

            <g transform="translate(0, 32)">
