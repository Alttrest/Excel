              <text x="10" y="16" fill="#34d399" font-family="monospace" font-size="10">03</text>
              <text x="40" y="16" fill="#f1f5f9" font-family="sans-serif" font-size="10">Bulut D.</text>
              <text x="170" y="16" fill="#94a3b8" font-family="monospace" font-size="10">20240924</text>
              <text x="270" y="16" fill="#6ee7b7" font-family="monospace" font-size="10">AI Research</text>
