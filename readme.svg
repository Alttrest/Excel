          <circle cx="42" cy="15" r="3.5" fill="#10b981"/>
          <text x="60" y="19" fill="#a7f3d0" font-family="monospace" font-size="10">OtomasyonApp [SQLite3 / CustomTkinter]</text>

          <g transform="translate(15, 45)">
